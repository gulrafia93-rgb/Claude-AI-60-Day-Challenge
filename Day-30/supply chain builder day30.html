<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supply Chain Builder</title>
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1420;
    --bg-2:#141a2a;
    --card:#161d2e;
    --card-hover:#1b2336;
    --border:#283250;
    --border-soft:#1f2740;
    --text-primary:#eef1f8;
    --text-secondary:#9aa5c0;
    --text-muted:#5f6a88;
    --accent:#5b8cff;
    --accent-2:#7c5cff;
    --gold:#e8b84b;
    --teal:#2fd6b8;
    --violet:#9a7bff;
    --red:#ff5c6c;
    --green:#3ddc97;
    --amber:#f5a623;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 10% 0%, #131a2c 0%, var(--bg-0) 55%) fixed;
    color:var(--text-primary);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  .app-shell{
    max-width:1180px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a3450;border-radius:10px;}

  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.02em;}
  p{margin:0;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:0 6px 18px rgba(91,140,255,0.35);
  }
  .brand-title{font-size:19px;font-weight:800;}
  .brand-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:999px;
    background:var(--card);
    border:1px solid var(--border-soft);
    font-size:12.5px;
    color:var(--text-secondary);
  }

  .card{
    background:linear-gradient(180deg, var(--card) 0%, #131929 100%);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:28px;
    box-shadow:var(--shadow);
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover{
    border-color:var(--border);
  }

  .btn{
    appearance:none;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text-primary);
    padding:12px 22px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s ease;
    letter-spacing:-0.01em;
  }
  .btn:hover{
    transform:translateY(-2px);
    background:var(--card-hover);
    border-color:var(--accent);
    box-shadow:0 8px 20px rgba(91,140,255,0.18);
  }
  .btn:active{transform:translateY(0px) scale(0.98);}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:none;
    color:white;
    box-shadow:0 8px 24px rgba(91,140,255,0.35);
  }
  .btn-primary:hover{
    box-shadow:0 10px 28px rgba(91,140,255,0.5);
    filter:brightness(1.05);
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border-soft);
    color:var(--text-secondary);
  }
  .btn-ghost:hover{
    color:var(--text-primary);
    border-color:var(--text-muted);
  }
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}

  .fade-in{
    animation:fadeIn 0.5s ease both;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .stagger > *{animation:fadeIn 0.5s ease both;}
  .stagger > *:nth-child(1){animation-delay:0.02s;}
  .stagger > *:nth-child(2){animation-delay:0.08s;}
  .stagger > *:nth-child(3){animation-delay:0.14s;}
  .stagger > *:nth-child(4){animation-delay:0.2s;}
  .stagger > *:nth-child(5){animation-delay:0.26s;}

  .section-label{
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:0.12em;
    color:var(--text-muted);
    font-weight:700;
    margin-bottom:10px;
  }

  /* Welcome */
  .hero{
    text-align:center;
    padding:60px 20px 20px;
  }
  .hero h1{
    font-size:42px;
    line-height:1.15;
    background:linear-gradient(135deg, #fff, #aebdf0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:18px;
  }
  .hero p.lead{
    font-size:17px;
    color:var(--text-secondary);
    max-width:680px;
    margin:0 auto 36px;
    line-height:1.65;
  }
  .concept-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:18px;
    margin:36px 0;
    text-align:left;
  }
  .concept-card{
    background:var(--card);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:20px;
    transition:transform 0.2s ease, border-color .2s ease;
  }
  .concept-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .concept-icon{font-size:26px;margin-bottom:10px;display:block;}
  .concept-card h4{font-size:15px;margin-bottom:6px;}
  .concept-card p{font-size:13px;color:var(--text-secondary);line-height:1.55;}

  /* Company reveal */
  .company-card{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
  @media (max-width:720px){
    .company-card{grid-template-columns:1fr;}
  }
  .stat-tile{
    background:var(--bg-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:16px 18px;
  }
  .stat-tile .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
  .stat-tile .value{font-size:16px;font-weight:700;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* Decision layout */
  .layout{
    display:grid;
    grid-template-columns: 1fr 340px;
    gap:24px;
    align-items:start;
  }
  @media (max-width:920px){
    .layout{grid-template-columns:1fr;}
  }
  .progress-track{
    display:flex;
    gap:6px;
    margin-bottom:24px;
  }
  .progress-seg{
    flex:1;
    height:6px;
    border-radius:4px;
    background:var(--border-soft);
    overflow:hidden;
    position:relative;
  }
  .progress-seg::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, var(--accent), var(--teal));
    transform:scaleX(var(--p, 0));
    transform-origin:left;
    transition:transform 0.6s cubic-bezier(.4,0,.2,1);
  }

  .step-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:10px;
  }
  .step-num{
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:6px;
    display:block;
  }
  .step-title{font-size:24px;margin-bottom:10px;}
  .step-why{
    background:var(--bg-2);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:14px 16px;
    font-size:13.8px;
    color:var(--text-secondary);
    line-height:1.6;
    margin-bottom:24px;
  }
  .step-why b{color:var(--text-primary);}

  .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:14px;
  }
  .option-card{
    text-align:left;
    background:var(--bg-2);
    border:1.5px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:18px;
    cursor:pointer;
    transition:all 0.22s ease;
    position:relative;
  }
  .option-card:hover{
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(91,140,255,0.15);
  }
  .option-card.selected{
    border-color:var(--teal);
    background:linear-gradient(180deg, rgba(47,214,184,0.08), rgba(47,214,184,0.02));
    box-shadow:0 0 0 1px var(--teal);
  }
  .option-icon{font-size:22px;margin-bottom:8px;display:block;}
  .option-title{font-size:15px;font-weight:700;margin-bottom:4px;}
  .option-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;}
  .impact-row{display:flex;gap:8px;flex-wrap:wrap;}
  .impact-tag{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    letter-spacing:0.02em;
  }
  .impact-up{background:rgba(61,220,151,0.12);color:var(--green);}
  .impact-down{background:rgba(255,92,108,0.12);color:var(--red);}
  .impact-neu{background:rgba(154,165,192,0.12);color:var(--text-secondary);}

  .explain-box{
    margin-top:22px;
    background:var(--bg-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:18px 20px;
    font-size:13.8px;
    line-height:1.65;
    color:var(--text-secondary);
  }
  .explain-box .ttl{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:8px;
  }
  .explain-box b{color:var(--text-primary);}

  /* Metrics sidebar */
  .metrics-panel{
    position:sticky;
    top:20px;
    background:linear-gradient(180deg, var(--card), #111729);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
  }
  .metrics-panel h3{font-size:14px;margin-bottom:4px;}
  .metrics-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:18px;}
  .metric-row{margin-bottom:16px;}
  .metric-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .metric-name{font-size:12.5px;color:var(--text-secondary);font-weight:600;display:flex;align-items:center;gap:6px;}
  .metric-val{font-size:13px;font-weight:700;}
  .bar-track{
    height:9px;
    border-radius:6px;
    background:var(--bg-1);
    overflow:hidden;
    border:1px solid var(--border-soft);
  }
  .bar-fill{
    height:100%;
    border-radius:6px;
    transition:width 0.8s cubic-bezier(.34,1.56,.64,1);
  }

  .company-mini{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--border-soft);
    font-size:12px;
    color:var(--text-muted);
    line-height:1.7;
  }
  .company-mini b{color:var(--text-secondary);}

  /* Dashboard */
  .score-hero{
    display:flex;
    align-items:center;
    gap:32px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .score-ring{
    width:160px;height:160px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .score-num{
    position:absolute;
    font-size:38px;
    font-weight:800;
  }
  .score-ring .score-out{
    position:absolute;
    bottom:38px;
    font-size:11px;
    color:var(--text-muted);
  }
  .score-grade{
    font-size:14px;
    color:var(--text-secondary);
    margin-top:4px;
  }

  .dash-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:18px;
    margin-top:28px;
  }
  .dash-card{
    background:var(--bg-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:20px;
  }
  .dash-card h4{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.07em;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dash-list{list-style:none;margin:0;padding:0;}
  .dash-list li{
    font-size:13.5px;
    color:var(--text-secondary);
    line-height:1.55;
    padding:8px 0;
    border-bottom:1px dashed var(--border-soft);
    display:flex;
    gap:10px;
  }
  .dash-list li:last-child{border-bottom:none;}
  .dash-list li .dot{
    flex-shrink:0;
    width:6px;height:6px;border-radius:50%;
    margin-top:7px;
  }

  .risk-callout{
    background:linear-gradient(180deg, rgba(255,92,108,0.1), rgba(255,92,108,0.03));
    border:1px solid rgba(255,92,108,0.35);
    border-radius:var(--radius-sm);
    padding:20px;
    margin-top:18px;
  }
  .risk-callout h4{color:var(--red);font-size:13px;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px;}
  .risk-callout p{font-size:14px;color:var(--text-secondary);line-height:1.6;}

  .decision-summary{
    margin-top:28px;
  }
  .decision-summary table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  .decision-summary th{
    text-align:left;
    color:var(--text-muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:10px 12px;
    border-bottom:1px solid var(--border-soft);
  }
  .decision-summary td{
    padding:12px;
    border-bottom:1px solid var(--border-soft);
    color:var(--text-secondary);
  }
  .decision-summary tr:hover td{background:rgba(255,255,255,0.02);}
  .decision-summary td.choice{color:var(--text-primary);font-weight:600;}

  .footer-note{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:var(--text-muted);
  }

  @media (max-width:600px){
    .hero h1{font-size:30px;}
    .card{padding:20px;}
    .score-hero{justify-content:center;text-align:center;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------------------------------------------------------
   DATA: random company generation
--------------------------------------------------------- */
const INDUSTRIES = [
  { name: "Athletic Footwear", products: "running shoes and sneakers", icon: "👟" },
  { name: "Consumer Electronics", products: "wireless earbuds and smart devices", icon: "🎧" },
  { name: "Organic Skincare", products: "natural skincare and cosmetics", icon: "🧴" },
  { name: "Furniture & Home Goods", products: "flat-pack furniture and home decor", icon: "🪑" },
  { name: "Specialty Coffee", products: "roasted coffee beans and brewing gear", icon: "☕" },
  { name: "Outdoor Apparel", products: "jackets and hiking gear", icon: "⛺" },
  { name: "Toys & Games", products: "educational toys and board games", icon: "🧸" },
  { name: "Bicycle Manufacturing", products: "bicycles and cycling accessories", icon: "🚲" },
  { name: "Pet Products", products: "pet food and accessories", icon: "🐶" },
  { name: "Artisan Snacks", products: "packaged snacks and beverages", icon: "🍪" },
];

const COUNTRY_SETS = [
  ["United States", "Canada", "Mexico"],
  ["Germany", "France", "Italy", "Spain"],
  ["United Kingdom", "Ireland"],
  ["Japan", "South Korea", "Australia"],
  ["Brazil", "Argentina", "Chile"],
  ["India", "United Arab Emirates", "Singapore"],
  ["United States", "United Kingdom", "Germany", "Japan"],
];

const DEMAND_LEVELS = [
  { level: "Steady", desc: "predictable, stable demand year-round", icon: "📈" },
  { level: "Seasonal Spikes", desc: "big demand surges around holidays or seasons", icon: "🏕" },
  { level: "Rapid Growth", desc: "demand is rising fast as the brand scales", icon: "🚀" },
  { level: "Volatile", desc: "demand swings unpredictably, hard to forecast", icon: "⚡" },
];

const COMPANY_PREFIXES = ["North", "Summit", "Clearwater", "Forge", "Meridian", "Lumen", "Anchor", "Bright", "Cedar", "Atlas"];
const COMPANY_SUFFIXES = ["Goods", "Works", "& Co.", "Supply", "Collective", "Labs", "Group", "Trading Co.", "Studio", "Industries"];

function generateCompany() {
  const industry = INDUSTRIES[Math.floor(Math.random() * INDUSTRIES.length)];
  const countries = COUNTRY_SETS[Math.floor(Math.random() * COUNTRY_SETS.length)];
  const demand = DEMAND_LEVELS[Math.floor(Math.random() * DEMAND_LEVELS.length)];
  const name = COMPANY_PREFIXES[Math.floor(Math.random() * COMPANY_PREFIXES.length)] + " " +
               COMPANY_SUFFIXES[Math.floor(Math.random() * COMPANY_SUFFIXES.length)];
  return { name, industry, countries, demand };
}

/* ---------------------------------------------------------
   DATA: decision steps, options & metric impacts
   Metrics: cost (lower=better shown inverted), speed, risk (lower better),
            satisfaction, sustainability  -- all stored as 0-100 "goodness" deltas
--------------------------------------------------------- */
const STEPS = [
  {
    key: "suppliers",
    title: "Choose Your Supplier Strategy",
    icon: "📦",
    why: "A supplier provides the raw materials or parts your factory needs. This is the very first link in your supply chain — if it breaks, everything downstream stops. The number of suppliers you rely on changes how cheap, fast, and risky your operations are.",
    options: [
      {
        id: "single",
        title: "Single Supplier",
        icon: "🎯",
        desc: "Rely on one trusted supplier for all materials. Simple to manage and often cheaper per unit due to bulk orders.",
        impacts: { cost: 14, speed: 6, risk: -22, satisfaction: 0, sustainability: 4 },
        tags: [["Lower Cost", "up"], ["Higher Risk", "down"]],
        explain: "A single supplier means simpler contracts and bigger bulk-order discounts, which lowers your <b>cost</b>. But if that one supplier has a fire, strike, or shortage, your entire production line halts — this is called <b>supplier concentration risk</b>, and it sharply raises your <b>risk</b> score."
      },
      {
        id: "multiple",
        title: "Multiple Suppliers",
        icon: "🌐",
        desc: "Spread orders across 2-4 suppliers in different regions. Costs a bit more, but if one fails, others keep you running.",
        impacts: { cost: -10, speed: -4, risk: 20, satisfaction: 4, sustainability: -6 },
        tags: [["Lower Risk", "up"], ["Higher Cost", "down"]],
        explain: "Multiple suppliers create redundancy — a backup plan. If one region faces a disruption (like a port closure), others can fill the gap. This raises <b>resilience</b> and lowers <b>risk</b>, but you lose bulk-buying power, so <b>cost</b> rises slightly, and coordinating shipments from multiple places slightly increases your carbon footprint."
      }
    ]
  },
  {
    key: "factory",
    title: "Choose Your Factory Location",
    icon: "🏭",
    why: "The factory is where raw materials become finished products. Its location determines your labor costs, how close you are to customers, and how exposed you are to global shipping disruptions.",
    options: [
      {
        id: "domestic",
        title: "Domestic (Home Country)",
        icon: "🏠",
        desc: "Manufacture close to home. Higher labor costs, but faster delivery and easier quality control.",
        impacts: { cost: -16, speed: 18, risk: 14, satisfaction: 10, sustainability: 10 },
        tags: [["Faster Delivery", "up"], ["Higher Cost", "down"]],
        explain: "Domestic factories cut shipping time dramatically, boosting <b>delivery speed</b> and <b>customer satisfaction</b>. You also avoid international tariffs and customs delays, which lowers <b>risk</b>. The tradeoff is that labor and real estate are typically pricier at home, raising <b>cost</b>. Shorter shipping routes also mean less fuel burned, helping <b>sustainability</b>."
      },
      {
        id: "nearshore",
        title: "Nearshore (Neighboring Region)",
        icon: "📍",
        desc: "Manufacture in a nearby country. A balance between cost savings and reasonable shipping times.",
        impacts: { cost: 6, speed: 6, risk: 4, satisfaction: 4, sustainability: 4 },
        tags: [["Balanced", "neu"]],
        explain: "Nearshoring — producing in a neighboring country — is a popular middle ground. You get moderately lower labor <b>costs</b> than at home, while shipping times stay reasonable, keeping <b>delivery speed</b> and <b>satisfaction</b> decent. It's a balanced choice across nearly every metric."
      },
      {
        id: "offshore",
        title: "Offshore (Overseas, Low-Cost Region)",
        icon: "✈️",
        desc: "Manufacture far away where labor is cheapest. Big cost savings, but long lead times and exposure to global shocks.",
        impacts: { cost: 20, speed: -18, risk: -16, satisfaction: -8, sustainability: -10 },
        tags: [["Lowest Cost", "up"], ["Slower & Riskier", "down"]],
        explain: "Offshoring to low-labor-cost countries is the classic way brands cut <b>cost</b> dramatically. But goods must now cross oceans, which adds weeks to <b>delivery speed</b> and exposes you to customs delays, geopolitical tension, and port congestion — all raising <b>risk</b>. Customers waiting longer for orders often feel less satisfied, and long-haul freight burns more fuel, hurting <b>sustainability</b>."
      }
    ]
  },
  {
    key: "warehouse",
    title: "Choose Your Warehouse Strategy",
    icon: "🏢",
    why: "Warehouses store finished goods between the factory and the customer. Where and how many you build affects how fast you can reach customers and how much it costs to hold inventory.",
    options: [
      {
        id: "central",

  risk:          { label: "Resilience (Low Risk)", icon: "🛡️", color: "#3ddc97", help: "Higher = safer from disruption" },
  satisfaction:  { label: "Customer Satisfaction", icon: "😊", color: "#9a7bff", help: "Higher = happier customers" },
  sustainability:{ label: "Sustainability",  icon: "🌿", color: "#2fd6b8", help: "Higher = lower environmental impact" },
};

function DecisionStep({ step, stepIndex, totalSteps, onChoose, lastExplain }) {
  const [selected, setSelected] = useState(null);

  useEffect(() => { setSelected(null); }, [step]);

  function handlePick(opt) {
    setSelected(opt.id);
    setTimeout(() => {
      onChoose(step.key, opt);
    }, 150);
  }

  return (
    <div className="card fade-in">
      <ProgressTrack total={totalSteps} current={stepIndex} />
      <span className="step-num">Decision {stepIndex + 1} of {totalSteps}</span>
      <div className="step-title-row">
        <h2 className="step-title">{step.icon} {step.title}</h2>
      </div>
      <div className="step-why"><b>Why this matters:</b> {step.why}</div>

      <div className="option-grid stagger">
        {step.options.map((opt) => (
          <div
            key={opt.id}
            className={"option-card" + (selected === opt.id ? " selected" : "")}
            onClick={() => handlePick(opt)}
          >
            <span className="option-icon">{opt.icon}</span>
            <div className="option-title">{opt.title}</div>
            <div className="option-desc">{opt.desc}</div>
            <div className="impact-row">
              {opt.tags.map(([label, dir], i) => (
                <span key={i} className={"impact-tag impact-" + dir}>{label}</span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {lastExplain && (
        <div className="explain-box fade-in">
          <div className="ttl">Trade-Off Explained</div>
          <div dangerouslySetInnerHTML={{ __html: lastExplain }} />
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Component: ScoreRing (SVG circular progress)
--------------------------------------------------------- */
function ScoreRing({ score }) {
  const radius = 70;
  const circumference = 2 * Math.PI * radius;
  const [animated, setAnimated] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setAnimated(score), 150);
    return () => clearTimeout(t);
  }, [score]);
  const offset = circumference - (animated / 100) * circumference;
  let color = "#ff5c6c";
  if (score >= 80) color = "#3ddc97";
  else if (score >= 60) color = "#2fd6b8";
  else if (score >= 40) color = "#e8b84b";

  return (
    <div className="score-ring">
      <svg width="160" height="160">
        <circle cx="80" cy="80" r={radius} stroke="#1f2740" strokeWidth="14" fill="none" />
        <circle
          cx="80" cy="80" r={radius}
          stroke={color} strokeWidth="14" fill="none"
          strokeDasharray={circumference}
          strokeDashoffset={offset}
          strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1.2s cubic-bezier(.34,1.56,.64,1)" }}
        />
      </svg>
      <div className="score-num" style={{ color }}>{Math.round(animated)}</div>
      <div className="score-out">/ 100</div>
    </div>
  );
}

/* ---------------------------------------------------------
   Dashboard scoring logic
--------------------------------------------------------- */
function buildDashboard(metrics, decisions, company) {
  const values = Object.keys(METRIC_META).map((k) => clamp(metrics[k]));
  const overall = Math.round(values.reduce((a, b) => a + b, 0) / values.length);

  const sorted = Object.keys(METRIC_META)
    .map((k) => ({ key: k, val: clamp(metrics[k]), label: METRIC_META[k].label }))
    .sort((a, b) => b.val - a.val);

  const strengths = sorted.slice(0, 2);
  const weaknesses = sorted.slice(-2).reverse();

  // Determine biggest risk narrative based on weakest metric + decisions made
  const weakestKey = sorted[sorted.length - 1].key;
  const riskNarratives = {
    cost: "Your supply chain runs expensive. Thin margins mean any price shock from suppliers or fuel costs could quickly erode profitability.",
    speed: "Deliveries are slow. In competitive markets, customers may abandon orders or switch to faster competitors.",
    risk: "Your chain is fragile. A single disruption — a supplier failure, port closure, or demand spike — could halt operations with little backup.",
    satisfaction: "Customers are likely underwhelmed by delivery times or availability, risking churn and negative reviews.",
    sustainability: "Your environmental footprint is high, which can invite regulatory scrutiny and turn away eco-conscious customers.",
  };
  const biggestRisk = riskNarratives[weakestKey];

  // Generate improvement suggestions from the two weakest metrics
  const improvementMap = {
    cost: "Consider renegotiating supplier contracts or shifting a portion of transport to rail or sea freight to cut costs.",
    speed: "Add a regional or micro-fulfillment warehouse closer to your largest market to cut delivery times.",
    risk: "Diversify to multiple suppliers and keep a balanced safety stock to protect against disruptions.",
    satisfaction: "Invest in faster shipping for your top market and increase inventory buffers to avoid stockouts.",
    sustainability: "Shift long-haul transport from air to rail or sea, and consolidate shipments to cut emissions.",
  };
  const improvementSet = new Set();
  [...weaknesses, sorted[sorted.length - 1]].forEach((w) => improvementSet.add(improvementMap[w.key]));
  // ensure exactly 3 distinct improvements, fill from remaining metrics if needed
  const allKeys = Object.keys(METRIC_META);
  for (const k of allKeys) {
    if (improvementSet.size >= 3) break;
    improvementSet.add(improvementMap[k]);
  }
  const improvements = Array.from(improvementSet).slice(0, 3);

  let grade = "Needs Significant Work";
  if (overall >= 85) grade = "World-Class Supply Chain";
  else if (overall >= 70) grade = "Strong & Competitive";
  else if (overall >= 55) grade = "Solid, With Room to Improve";
  else if (overall >= 40) grade = "Fragile — Needs Attention";

  return { overall, strengths, weaknesses, biggestRisk, improvements, grade };
}

/* ---------------------------------------------------------
   Root App
--------------------------------------------------------- */
function App() {
  const [phase, setPhase] = useState("welcome"); // welcome | reveal | building | dashboard
  const [company, setCompany] = useState(null);
  const [stepIndex, setStepIndex] = useState(0);
  const [metrics, setMetrics] = useState({ ...BASE_METRICS });
  const [decisions, setDecisions] = useState({});
  const [lastExplain, setLastExplain] = useState(null);

  function startGame() {
    const c = generateCompany();
    setCompany(c);
    setPhase("reveal");
  }

  function beginBuilding() {
    setStepIndex(0);
    setMetrics({ ...BASE_METRICS });
    setDecisions({});
    setLastExplain(null);
    setPhase("building");
  }

  function handleChoose(key, opt) {
    setMetrics((prev) => {
      const next = { ...prev };
      Object.keys(opt.impacts).forEach((m) => {
        next[m] = clamp(prev[m] + opt.impacts[m]);
      });
      return next;
    });
    setDecisions((prev) => ({ ...prev, [key]: opt }));
    setLastExplain(opt.explain);

    if (stepIndex + 1 >= STEPS.length) {
      setTimeout(() => setPhase("dashboard"), 700);
    } else {
      setTimeout(() => {
        setStepIndex((i) => i + 1);
        setLastExplain(null);
      }, 900);
    }
  }

  function replay() {
    const c = generateCompany();
    setCompany(c);
    setStepIndex(0);
    setMetrics({ ...BASE_METRICS });
    setDecisions({});
    setLastExplain(null);
    setPhase("reveal");
  }

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">🔗</div>
          <div>
            <div className="brand-title">Supply Chain Builder</div>
            <div className="brand-sub">Learn supply chains by building one, decision by decision</div>
          </div>
        </div>
        {company && phase !== "welcome" && (
          <div className="pill">{company.industry.icon} {company.name}</div>
        )}
      </div>

      {phase === "welcome" && <WelcomeScreen onStart={startGame} />}

      {phase === "reveal" && company && (
        <CompanyReveal company={company} onContinue={beginBuilding} />
      )}

      {phase === "building" && company && (
        <div className="layout">
          <DecisionStep
            step={STEPS[stepIndex]}
            stepIndex={stepIndex}
            totalSteps={STEPS.length}
            onChoose={handleChoose}
            lastExplain={lastExplain}
          />
          <MetricsPanel metrics={metrics} company={company} />
        </div>
      )}

      {phase === "dashboard" && company && (
        <Dashboard metrics={metrics} decisions={decisions} company={company} onReplay={replay} />
      )}

      <div className="footer-note">
        Supply Chain Builder &middot; A learning simulator &middot; All data is generated locally, nothing leaves your browser.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
